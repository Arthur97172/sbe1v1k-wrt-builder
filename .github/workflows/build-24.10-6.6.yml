name: 📦 Build 24.10-6.6

# 在 GitHub Actions 上编译 Spectrum SBE1V1K（IPQ9574）OpenWrt+QSDK 固件，
# 并把三个交付镜像发布到本次运行专属的 GitHub Release。
#
# 编译输入是 sources-vN：由 .github/workflows/sources-24.10-6.6.yml 用公开上游
# 现场装配并发布（tar.zst + SHA256SUMS + TREE-FINGERPRINT.json，恰好 3 个资产）。
# 本 workflow 只下载、校验、编译，不装配源码。
#
# 门禁顺序（每一步失败都在编译前停下）：
#   1. SHA256SUMS 校验源码包；
#   2. 解包后用 TREE-FINGERPRINT.tsv 重算树指纹，未解释差异必须为 0；
#   3. TREE-FINGERPRINT.json 里的 recipe_sha256 必须等于本仓库当前配方的哈希；
#   4. render-overlay.sh + check-config.sh：overlay 渲染后再比对冻结 .config；
#   5. thirdparty-feeds.sh check（SBE_NO_GIT=1，源码包不带 .git）；
#   6. download-preflight.sh：make -k download 取齐第三方 tarball；
#   7. check-package-deps.sh：defconfig 之后核对选中包的运行时依赖闭包
#      （kconfig 对未接线的依赖只打 WARNING，编译能过、到 opkg 安装才失败）。
#
# 说明：
#   - 构建不会接触任何设备，仅下载源码包与编译依赖；
#   - 不发布 private key；CI 会生成自己的 opkg 签名密钥，因此产物与本地
#     G3.9 基线“功能等价但签名不同”，不宣称逐字节一致；
#   - 首次运行结果在人工核对前一律记为 UNVERIFIED。

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: '源码包 tag（auto = 最新且资产数为 3 的 sources-vN，N≥2）'
        required: true
        default: 'auto'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-24.10-6.6.yml'
      - '24.10-6.6/**'

permissions:
  contents: read

concurrency:
  group: build-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
    outputs:
      source_tag: ${{ steps.tag.outputs.tag }}
      release_tag: ${{ steps.meta.outputs.tag }}
      vline: ${{ steps.meta.outputs.vline }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            unzip zlib1g-dev file wget ca-certificates patch bc \
            libelf-dev libxml-parser-perl libtool-bin autoconf automake \
            cmake device-tree-compiler zstd swig python3 python3-dev

      - name: Resolve source tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          want='${{ inputs.source_tag }}'
          if [ -n "$want" ] && [ "$want" != auto ]; then
            tag=$want
          else
            # 只认 3 个资产的 sources-vN；sources-v1 是 4 资产 legacy，跳过。
            tag=''
            for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
                         --json tagName --jq '.[].tagName' \
                       | grep -E '^sources-v[0-9]+$' \
                       | sed 's/^sources-v//' | sort -rn | head -20); do
              [ "$t" -ge 2 ] || continue
              cand="sources-v$t"
              n=$(gh release view "$cand" --repo "$GITHUB_REPOSITORY" \
                    --json assets --jq '.assets | length')
              if [ "$n" = 3 ]; then tag=$cand; break; fi
              echo "::$warning::$cand 有 $n 个资产，不是预期的 3 个，跳过"
            done
            [ -n "$tag" ] || { echo "::error::找不到可用的 sources-vN（N≥2，3 个资产）"; exit 1; }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "使用源码包：$tag"

      - name: Download source bundles
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle"
          gh release download "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'sbe1v1k-sources-*.tar.zst' \
            --pattern 'SHA256SUMS' \
            --pattern 'TREE-FINGERPRINT.json' \
            --dir "$RUNNER_TEMP/bundle"
          n=$(find "$RUNNER_TEMP/bundle" -maxdepth 1 -type f | wc -l)
          [ "$n" = 3 ] || { echo "::error::$SOURCE_TAG 应恰好 3 个资产，实际下载 $n 个"; exit 1; }
          ( cd "$RUNNER_TEMP/bundle" && sha256sum -c SHA256SUMS )
          ls -lh "$RUNNER_TEMP/bundle"

      - name: Extract source bundle
        run: |
          set -euo pipefail
          mkdir -p sources
          tar --zstd -xf "$RUNNER_TEMP"/bundle/sbe1v1k-sources-*.tar.zst -C sources
          du -sh sources/*
          for f in buildroot/Makefile luci/luci.mk README.md PROVENANCE.md \
                   TREE-FINGERPRINT.json TREE-FINGERPRINT.tsv; do
            [ -e "sources/$f" ] || { echo "::error::源码包缺少 $f"; exit 1; }
          done

      - name: Verify tree fingerprint
        run: |
          set -euo pipefail
          ./24.10-6.6/scripts/ci/tree-fingerprint.sh \
            --root sources \
            --exclude 24.10-6.6/build/fingerprint-exclude.conf \
            --profile fresh \
            --out fp.json --tsv fp.tsv \
            --compare sources/TREE-FINGERPRINT.tsv \
            --known-delta 24.10-6.6/build/known-delta.conf

      - name: Verify recipe hash
        run: |
          set -euo pipefail
          want=$(sed -n 's/.*"recipe_sha256": "\([0-9a-f]*\)".*/\1/p' sources/TREE-FINGERPRINT.json)
          got=$(./24.10-6.6/scripts/ci/recipe-hash.sh)
          [ -n "$want" ] || { echo "::error::TREE-FINGERPRINT.json 里没有 recipe_sha256"; exit 1; }
          if [ "$want" != "$got" ]; then
            echo "::error::配方哈希不符：源码包 $want，本仓库 $got（装配输入在发布后被改过）"
            exit 1
          fi
          echo "recipe_sha256 $got"

      - name: Prepare build tree
        run: ./24.10-6.6/scripts/ci/prepare-tree.sh "$GITHUB_WORKSPACE"

      - name: Render files overlay
        # 快速失败：banner 占位符没替换成功就不要开始数小时的编译。
        # 必须排在 check-config 之前：冻结 .config 的等价性依赖 overlay 里的配置片段。
        run: ./24.10-6.6/scripts/render-overlay.sh

      - name: Check frozen config
        run: ./24.10-6.6/scripts/ci/check-config.sh "$GITHUB_WORKSPACE"

      - name: Verify thirdparty source pins
        # 只读校验：源码包里的第三方仓库 HEAD 必须等于文件 A 的 pin，
        # thirdparty-feed 的相对软链必须指向正确目录。
        # 源码包不带 .git，所以按 pin/指纹信任（SBE_NO_GIT=1）。
        env:
          SBE_NO_GIT: '1'
        run: ./24.10-6.6/scripts/thirdparty-feeds.sh check

      - name: Download third-party tarballs
        # 源码包不含 dl/；先 make -k download 把第三方 tarball 取齐，
        # 任何一条取不到都在这里失败并给出 DOWNLOAD_FAIL 清单。
        run: ./24.10-6.6/scripts/ci/download-preflight.sh "$GITHUB_WORKSPACE"

      - name: Apply custom packages
        # 应用文件 B（应用开关）并逐包反查。defconfig 对未知包是静默丢弃的，
        # 反查失败即在此停止，不进入数小时的编译。
        run: ./24.10-6.6/build/sbe1v1k-build.sh defconfig

      - name: Check package dependencies
        # defconfig 对未接线的依赖只打一行 WARNING 就丢弃：包照样编得出来，
        # 直到 package/install 才由 opkg 报 "cannot find dependency X for Y"。
        # 该报错又被 verbose.mk 吞进 /dev/null，等于浪费一整轮编译（run 42401311130）。
        run: ./24.10-6.6/scripts/ci/check-package-deps.sh "$GITHUB_WORKSPACE/sources/buildroot"

      - name: Build
        id: build
        run: |
          set -o pipefail
          ./24.10-6.6/build/sbe1v1k-build.sh -j"$(nproc)" 2>&1 | tee build.log

      - name: Diagnose build failure
        # OpenWrt 的 include/verbose.mk 在非 V=s 模式下把子 make 的输出整体丢进
        # /dev/null（fd 8/9 只留进度行），所以构建失败时控制台只有
        # "make[2] package/install" 之类的行、没有报错。失败后用 -j1 V=s 重跑：
        # 已编译的目标不会重编，只会把卡住的那一步的真实输出打出来。
        #
        # Actions 的步骤日志与 artifact 下载都要求登录，匿名只能看到 job 页上的
        # annotations；所以再把 diagnose.log 尾部压成一条 ::error:: 注解
        # （换行转义成 %0A），失败原因不必登录也能读。
        #
        # 只在 Build 步骤失败时重跑：门禁步骤（如 recipe 哈希不符）失败时重跑
        # 编译没有意义——上一轮曾因此白编 5 分钟 cmake，注解里全是构建噪声，
        # 真正的原因（配方哈希不符）反而被淹没。
        if: failure() && steps.build.outcome == 'failure'
        run: |
          set -o pipefail
          timeout 1200 ./24.10-6.6/build/sbe1v1k-build.sh -j1 V=s 2>&1 \
            | tail -n 400 | tee diagnose.log || true
          echo "=== diagnose.log 行数: $(wc -l < diagnose.log 2>/dev/null || echo 0) ==="
          # GitHub 单条注解只保留 4096 字，所以只发末尾 40 行与错误关键行：
          # 400 行整体发出去会被截成窗口开头，正好把报错截掉（已实测）。
          if [ -s diagnose.log ]; then
            msg=$(tail -n 40 diagnose.log \
              | awk 'BEGIN { ORS="" } { gsub(/%/, "%25"); gsub(/\r/, "%0D");
                  if (NR > 1) printf "%%0A"; printf "%s", substr($0, 1, 200) }')
            echo "::error::diagnose.log 末尾 40 行：${msg}"
            hits=$(grep -aE 'error|Error|failed|Failed|cannot|conflict|No space|postinst|Collected errors|Segmentation' diagnose.log \
              | tail -n 20 \
              | awk 'BEGIN { ORS="" } { gsub(/%/, "%25"); gsub(/\r/, "%0D");
                  if (NR > 1) printf "%%0A"; printf "%s", substr($0, 1, 200) }' || true)
            if [ -n "$hits" ]; then echo "::error::diagnose.log 关键行：${hits}"; fi
          else
            echo "::error::diagnose.log 缺失或为空"
          fi
          exit 0

      - name: Verify image (static)
        if: success()
        env:
          # CI 镜像必须带厂商 Wi-Fi 固件（LICENSE_REVIEW_REQUIRED，已获准公开分发）。
          SBE_EXPECT_WIFI_FIRMWARE: '1'
        run: ./24.10-6.6/scripts/ci/verify-image.sh "$GITHUB_WORKSPACE"

      - name: Collect release assets
        if: success()
        run: |
          set -eu
          OUT=sources/buildroot/bin/targets/ipq95xx/generic
          REL="$RUNNER_TEMP/release"
          mkdir -p "$REL"
          for n in squashfs-sysupgrade.bin fit-uImage.itb initramfs-fit-uImage.itb; do
            src="$OUT/openwrt-ipq95xx-generic-spectrum_sbe1v1k-$n"
            test -s "$src" || { echo "缺少或为空：$src" >&2; exit 1; }
            cp "$src" "$REL/"
          done
          ( cd "$REL" && sha256sum openwrt-ipq95xx-generic-spectrum_sbe1v1k-* )
          ls -lh "$REL"

      - name: Record release tag
        if: success()
        id: meta
        run: |
          echo "tag=v${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"
          VLINE=$(grep -m1 '^ Version:' sources/buildroot/files/etc/banner | sed 's/^ *//')
          echo "vline=$VLINE" >> "$GITHUB_OUTPUT"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            build.log
            diagnose.log
            download.log
            download-fail.txt
            check-config.log
            config-diff.txt
            fp.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sbe1v1k-firmware-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/release/openwrt-ipq95xx-generic-spectrum_sbe1v1k-squashfs-sysupgrade.bin
            ${{ runner.temp }}/release/openwrt-ipq95xx-generic-spectrum_sbe1v1k-fit-uImage.itb
            ${{ runner.temp }}/release/openwrt-ipq95xx-generic-spectrum_sbe1v1k-initramfs-fit-uImage.itb
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: sbe1v1k-firmware-${{ github.run_number }}
          path: ${{ runner.temp }}/release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
          SOURCE_TAG: ${{ needs.build.outputs.source_tag }}
          VLINE: ${{ needs.build.outputs.vline }}
        run: |
          set -eu
          REL="$RUNNER_TEMP/release"
          n=$(find "$REL" -maxdepth 1 -type f | wc -l)
          [ "$n" = 3 ] || { echo "::error::固件资产应为 3 个，实际 $n"; exit 1; }
          # 每次运行一个独立 Release：tag 带 run/attempt/短 SHA，重跑不覆盖旧产物。
          cat > "$REL/notes.md" <<EOF
          Spectrum SBE1V1K (IPQ9574) firmware — OpenWrt 24.10-SNAPSHOT + QSDK 14.0

          - 版本行：${VLINE}
          - 提交：\`${GITHUB_SHA}\`
          - 运行：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - 源码包：\`${SOURCE_TAG}\`（SHA256SUMS、树指纹、配方哈希三道校验均通过）

          资产（恰好 3 个）：
          - \`openwrt-ipq95xx-generic-spectrum_sbe1v1k-squashfs-sysupgrade.bin\`
          - \`openwrt-ipq95xx-generic-spectrum_sbe1v1k-fit-uImage.itb\`
          - \`openwrt-ipq95xx-generic-spectrum_sbe1v1k-initramfs-fit-uImage.itb\`

          SHA-256：
          \`\`\`
          $(cd "$REL" && sha256sum openwrt-ipq95xx-generic-spectrum_sbe1v1k-*.bin \
              openwrt-ipq95xx-generic-spectrum_sbe1v1k-*.itb)
          \`\`\`

          CI 使用自动生成的签名密钥，故 opkg 签名与本地构建不同；功能等价，
          不宣称逐字节一致。产物未经真机验证前一律记为 UNVERIFIED。
          EOF

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SBE1V1K ${TAG}" \
            --notes-file "$REL/notes.md" \
            "$REL/openwrt-ipq95xx-generic-spectrum_sbe1v1k-squashfs-sysupgrade.bin" \
            "$REL/openwrt-ipq95xx-generic-spectrum_sbe1v1k-fit-uImage.itb" \
            "$REL/openwrt-ipq95xx-generic-spectrum_sbe1v1k-initramfs-fit-uImage.itb"

          n=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          echo "release $TAG assets=$n"
          test "$n" = "3" || { echo "Release 资产数不是 3" >&2; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"'
