name: 📦 Build 25.12-6.12

# 在 GitHub Actions 上编译 Spectrum SBE1V1K（IPQ9574）OpenWrt 25.12 +
# 主线 Linux 6.12 固件（Stage 2.5：上游 qualcommbe/ipq95xx 基线 + QSDK NSS
# 数据通路 + ath12k 无线，无线固件为厂商 QSDK14 的专有 blob），
# 并把三个交付镜像发布到本次运行专属的 GitHub Release。
#
# 与 24.10-6.6 不同，25.12 完全基于公开源码：
#   - openwrt/openwrt @ openwrt-25.12（固定提交，见 prepare-tree.sh）
#   - 官方 feeds（固定提交）
#   - 本项目补丁 25.12-6.12/patches/
# 因此不需要 sources-* Release 源码包。
#
# 6 个 Wi-Fi 固件 blob 是厂商专有二进制（LICENSE_REVIEW_REQUIRED，项目决策
# N-3）。2026-10-24 用户明确决定：**公开 CI 镜像也带这些 blob**，接受公开
# 分发风险；因此 blob 已入库（.gitignore 不再排除），Configure 步骤断言
# sbe-wifi-firmware 保持选中，verify-image.sh 再断言镜像内 6 个文件逐字节
# 一致。授权状态仍记为 LICENSE_REVIEW_REQUIRED。
#
# 因此 CI 产出的镜像含 ath12k 驱动、hostapd/wifi-scripts 以及
# firmware-2.bin / board-2.bin / regdb.bin / bdf41；真机无线仍需 S09 从
# eMMC ART 生成 cal-pci-*.bin（见 25.12-6.12/README.md）。
#
# 说明：
#   - 构建不会接触任何设备，仅下载源码与编译依赖；
#   - 产物未经真机验证前一律记为 UNVERIFIED。

on:
  workflow_dispatch:
    inputs:
      plugin_mode:
        description: '第三方插件版本：latest=每次构建解析最新 tag；pinned=按 thirdparty-pins.conf 复现旧镜像'
        type: choice
        options:
          - latest
          - pinned
        default: latest
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-25.12-6.12.yml'
      - '25.12-6.12/**'

permissions:
  contents: write

concurrency:
  group: build-firmware-25.12-6.12-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            unzip zlib1g-dev file wget ca-certificates patch bc \
            libelf-dev libxml-parser-perl libtool-bin autoconf automake \
            cmake device-tree-compiler zstd swig python3 python3-dev \
            cpio time

      - name: Prepare build tree
        env:
          # 18 个插件在 prepare-tree.sh 内部安装：默认每次构建解析各仓库最新
          # 版本 tag（不改写仓库里的 pin 文件），实际提交写进 .sbe-plugins.tsv。
          # CI 用严格模式：远端不可达/分叉时直接失败，避免“以为在跟新”。
          SBE_PLUGIN_MODE: ${{ inputs.plugin_mode || 'latest' }}
          SBE_PLUGIN_STRICT: '1'
        run: ./25.12-6.12/scripts/ci/prepare-tree.sh "$GITHUB_WORKSPACE"

      # 6.12 内核漂移检测：只报告，不修改 OPENWRT_SHA / 内核版本 / 补丁。
      # 网络不可用只记 SOURCE_UNAVAILABLE；continue-on-error 保证它永不阻塞构建。
      - name: Check kernel (report only)
        continue-on-error: true
        run: |
          set -o pipefail
          ./25.12-6.12/scripts/ci/check-kernel.sh "$GITHUB_WORKSPACE" | tee kernel-report.txt

      # 镜像必须带厂商固件（2026-10-24 决定）。defconfig 对未知包是静默丢弃，
      # 所以构建前做三重检查：种子里有 =y、blob 在本仓库里且哈希正确、
      # defconfig 之后仍然 =y。任一项不满足就停，避免发布无无线的镜像。
      - name: Configure
        run: |
          set -eu
          CFG=sources/buildroot-25.12-6.12/.config
          FW=25.12-6.12/build/local-packages/sbe-wifi-firmware/files
          cp 25.12-6.12/build/config-seed/ipq95xx-spectrum-sbe1v1k.seed "$CFG"
          # 种子必须包含 required-packages.txt 的全部必装项、不含必禁项。
          ./25.12-6.12/scripts/ci/check-packages.sh seed "$CFG"
          grep -qx 'CONFIG_PACKAGE_sbe-wifi-firmware=y' "$CFG" \
            || { echo "种子里没有 CONFIG_PACKAGE_sbe-wifi-firmware=y，检查本步骤是否已过期" >&2; exit 1; }
          ( cd "$FW" && sha256sum -c FILES-SHA256 ) \
            || { echo "固件 blob 缺失或哈希不符（是否被 .gitignore 排除？）" >&2; exit 1; }
          # 先生成包索引再核对：插件 Makefile 损坏、插件与官方 feed 重名、
          # 上游改名导致包不存在，都在 defconfig 之前暴露，而不是 3 小时之后。
          ./25.12-6.12/build/sbe1v1k-build.sh prepare-tmpinfo
          ./25.12-6.12/scripts/ci/check-packages.sh index sources/buildroot-25.12-6.12
          ./25.12-6.12/build/sbe1v1k-build.sh defconfig
          # defconfig 对未知/冲突的包是静默丢弃，这里逐包反查。
          ./25.12-6.12/scripts/ci/check-packages.sh config "$CFG"
          grep -qx 'CONFIG_PACKAGE_sbe-wifi-firmware=y' "$CFG" \
            || { echo "defconfig 之后 sbe-wifi-firmware 被丢弃" >&2; exit 1; }
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)=' "$CFG"

      - name: Build
        run: |
          set -o pipefail
          if ./25.12-6.12/build/sbe1v1k-build.sh world -j"$(nproc)" 2>&1 | tee build.log; then
            exit 0
          fi
          # 非 verbose 的 world 用 `make -s` 跑每个包，包内部的编译错误被丢弃
          # （include/subdir.mk 的 log_make 只在 CONFIG_BUILD_LOG=y 时才把输出 tee
          # 到 logs/，本配置没开）。于是 build.log 只剩一行
          # "ERROR: package/X failed to build"，看不出真正原因。
          # 这里只重编失败的包并开 V=s：错误进 job 日志，完整输出进 build.log 附件。
          pkg=$(sed -n 's/.*ERROR: package\/\([^ ]*\) failed to build.*/\1/p' build.log | head -n1)
          {
            echo "===== 构建失败：${pkg:-未能从 build.log 识别失败的包} ====="
            df -h /
            free -h
          } 2>&1 | tee -a build.log
          if [ -n "$pkg" ]; then
            rerun="$RUNNER_TEMP/rerun-${GITHUB_RUN_NUMBER}.log"
            if ./25.12-6.12/build/sbe1v1k-build.sh "package/$pkg/compile" V=s -j1 >"$rerun" 2>&1; then
              # 串行重编却通过：失败要么与并发时序有关，要么是包外的因素（磁盘、
              # 被 OOM 杀掉的 cc1 等）。把这些也留进日志。
              echo "===== $pkg 以 V=s -j1 重编通过，未复现 ====="
              sudo dmesg --ctime 2>/dev/null | tail -n 30 || true
            else
              cat "$rerun" >> build.log
              echo "===== error 摘要（前 8 处） ====="
              grep -n -m 8 -E 'error:|Error [0-9]+$|No such file or directory|undefined reference' "$rerun" \
                || echo "（未匹配到常见错误模式，见下方尾部）"
              echo "===== $pkg 重建日志尾部 200 行 ====="
              tail -n 200 "$rerun"
            fi
          fi
          exit 1

      - name: Verify image (static)
        id: verify
        if: success()
        run: |
          set -o pipefail
          ./25.12-6.12/scripts/ci/verify-image.sh "$GITHUB_WORKSPACE" 2>&1 | tee verify.log

      - name: Diagnose image verification
        # 与 24.10 同理：步骤日志和 artifact 对匿名访问不可读，把 FAIL 行与
        # 末尾内容压成 ::error:: 注解，失败原因不登录也能看到。
        # 每条 FAIL 都是一行断言失败，全部塞进同一个注解（GitHub 会把同一个
        # 步骤的多个注解折叠，只显示前几条，分开发反而看不全）。
        if: failure() && steps.verify.outcome == 'failure'
        run: |
          enc() {
            awk 'BEGIN { ORS="" } { gsub(/%/, "%25"); gsub(/\r/, "%0D");
                if (NR > 1) printf "%%0A"; printf "%s", substr($0, 1, 300) }'
          }
          if [ -s verify.log ]; then
            hits=$(grep -aE '^FAIL|^SUMMARY' verify.log | head -n 80 | enc || true)
            if [ -n "$hits" ]; then
              echo "::error::verify.log 断言失败：${hits}"
            else
              # 没有 FAIL 行说明脚本在输出前就死了（set -e / 缺工具 / 提取失败）。
              msg=$(tail -n 60 verify.log | enc)
              echo "::error::verify.log 无 FAIL 行，末尾 60 行：${msg}"
            fi
          else
            echo "::error::verify.log 缺失或为空（脚本可能在输出前就退出了）"
          fi
          exit 0


      - name: Collect release assets
        if: success()
        run: |
          set -eu
          OUT=sources/buildroot-25.12-6.12/bin/targets/qualcommbe/ipq95xx
          REL="$RUNNER_TEMP/release"
          mkdir -p "$REL"
          for n in squashfs-sysupgrade.bin fit-uImage.itb initramfs-fit-uImage.itb; do
            src="$OUT/sbe1v1k-$n"
            test -s "$src" || { echo "缺少或为空：$src" >&2; exit 1; }
            cp "$src" "$REL/sbe1v1k-$n"
          done
          ( cd "$REL" && sha256sum sbe1v1k-* )
          ls -lh "$REL"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-25.12-6.12-${{ github.run_number }}
          path: |
            build.log
            verify.log
            kernel-report.txt
            sources/buildroot-25.12-6.12/.sbe-plugins.tsv
          if-no-files-found: warn
          retention-days: 7

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sbe1v1k-25.12-6.12-firmware-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/release/sbe1v1k-squashfs-sysupgrade.bin
            ${{ runner.temp }}/release/sbe1v1k-fit-uImage.itb
            ${{ runner.temp }}/release/sbe1v1k-initramfs-fit-uImage.itb
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="v${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:8}-25.12-6.12"
          REL="$RUNNER_TEMP/release"
          VLINE=$(grep -m1 '^ Version:' sources/buildroot-25.12-6.12/files/etc/banner | sed 's/^ *//')

          cat > "$REL/notes.md" <<EOF
          Spectrum SBE1V1K (IPQ9574) firmware — OpenWrt 25.12 + 主线 Linux 6.12（Stage 2.5）

          - 版本行：${VLINE}
          - 提交：\`${GITHUB_SHA}\`
          - 运行：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - 基线：upstream qualcommbe/ipq95xx + RDP433 device tree + QSDK NSS 数据通路
          - 无线：ath12k 驱动 + hostapd/wifi-scripts + 厂商 QCN92XX 固件/板级 BDF
          - 未接入：NSS Wi-Fi offload、厂商 ath12k 私有参数

          资产（恰好 3 个）：
          - \`sbe1v1k-squashfs-sysupgrade.bin\`
          - \`sbe1v1k-fit-uImage.itb\`
          - \`sbe1v1k-initramfs-fit-uImage.itb\`

          SHA-256：
          \`\`\`
          $(cd "$REL" && sha256sum sbe1v1k-*)
          \`\`\`

          本镜像**包含**厂商 Wi-Fi 固件（firmware-2.bin / board-2.bin /
          regdb.bin / bdf41）。这些是专有二进制，授权状态
          LICENSE_REVIEW_REQUIRED（项目决策 N-3）；按 2026-10-24 的决定随镜像
          公开分发。每台设备的 cal-pci-*.bin 仍由镜像内的 S09sbe-wifi-cal 在
          开机时从本机 eMMC 0:ART 生成，ath12k 才会 probe。详见
          25.12-6.12/README.md 的“启用无线”一节。

          未在真机验证。NSS Wi-Fi offload 未接入。刷写前先读 25.12-6.12/README.md。
          EOF

          # 插件实际提交表与内核检测结论。两者都是“本次构建的快照”：
          # latest 模式下插件每次可能不同，复现旧镜像用 workflow_dispatch 的
          # plugin_mode=pinned。
          PLUG=sources/buildroot-25.12-6.12/.sbe-plugins.tsv
          {
            echo ""
            echo "第三方插件（本次实际使用的提交）："
            echo ""
            if [ -s "$PLUG" ]; then
              echo "| 仓库 | tag | commit | 动作 |"
              echo "|---|---|---|---|"
              tail -n +2 "$PLUG" | \
                awk -F'\t' '{printf "| %s | %s | `%s` | %s |\n", $1, $3, substr($4,1,12), $6}'
            else
              echo "（没有生成 $PLUG）"
            fi
            echo ""
            echo "内核检测（report-only；不会自动改 OPENWRT_SHA 或内核 pin）："
            echo ""
            if [ -s kernel-report.txt ]; then
              cat kernel-report.txt
            else
              echo "（没有生成 kernel-report.txt）"
            fi
          } >> "$REL/notes.md"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SBE1V1K 25.12-6.12 ${TAG}" \
            --notes-file "$REL/notes.md" \
            "$REL/sbe1v1k-squashfs-sysupgrade.bin" \
            "$REL/sbe1v1k-fit-uImage.itb" \
            "$REL/sbe1v1k-initramfs-fit-uImage.itb"

          n=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          echo "release $TAG assets=$n"
          test "$n" = "3" || { echo "Release 资产数不是 3" >&2; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"'
