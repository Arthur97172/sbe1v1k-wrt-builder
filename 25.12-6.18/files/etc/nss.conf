# 25.12-6.18 NSS 数据通路启停策略，由 /etc/init.d/nss（S15）在启动时读取。
# 机制与 25.12-6.12 相同（见该树 docs/NSS_AUTOLOAD_OFF.md）：QSDK NSS 栈
# （qca-ssdk / qca-nss-dp / qca-nss-ppe / qca-nss-ecm）不随 kmodloader 自动
# 装载、不随 rcS 自动启动，改由 /usr/sbin/nss-load 按档位分层装载。
#
# 本文件只对 NSS 数据通路生效：设备树保留 mainline PPE 节点时
# /usr/lib/sbe1v1k/nss-board 返回 1，S15 直接跳过。
#
# tier 取值：
#   off    什么都不装载。没有以太网口，改回本文件只能用恢复模式/离线挂 overlay。
#   wired  qca-ssdk + qca-nss-dp。有线管理与网络恢复的最小集合，也是 fallback 值。
#   full   有线 + qca-nss-ppe 全家 + qca-nss-ecm。6.12 树在生产上用的档位，
#          6.18 于 2026-11-24 S4 真机验证 PASS（连续启动自动装载全层、
#          ECM 连接计数随转发流量增长、300 s commit 清零，见
#          docs/WIRED-DATAPATH-DEVICE-TEST-2026-11-23.md 的 S4 小节）。
# 其它值（sdk / dp / ppe / ecm / sfe）仅供 nss-load 手工分层使用，启动时也接受。
#
# 6.18 首个 NSS 镜像（S3d）曾默认 wired，先单独验证有线数据通路；S4 验证
# 通过后默认档已切 full（2026-11-24），与 6.12 生产形态一致。
#
# fallback / budget：每启动一次计数器 +1；系统在 300 秒内没有崩溃时
# nss-load commit 把计数器清零。连续 budget 次启动都没等到 commit，启动改用
# fallback 档，避免一次改档把设备锁死在复位循环里。改档后请保留 fallback。
tier=full
fallback=wired
budget=3
