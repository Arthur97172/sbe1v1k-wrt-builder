# 诊断变体（SBE_VARIANT=diag）的 NSS 档位：off。
#
# 本文件覆盖 files/etc/nss.conf（render-overlay.sh 先铺 files/ 再叠
# files-diag/）。D 变体的目的：镜像里 QSDK NSS/SSDK 组件齐全，但启动时
# 不装载任何一层 —— 先静置 10 分钟，区分「NSS 装载把内核带进 oops/复位」
# 与「其他复位源」。之后手工逐层验证：
#
#   nss-load load sdk && sleep 60 && nss-load load dp \
#     && sleep 60 && nss-load load ppe && sleep 120
#
# 每装载一层，板面信标（sbe-diag-beacon）的绿灯次数就应当 +1。
# fallback=off：不允许掉回任何会装载 NSS 的档位（否则实验条件被绕过）。
# 本文件在 RAM 镜像里，改动不落盘，重启即恢复。
tier=off
fallback=off
budget=3
