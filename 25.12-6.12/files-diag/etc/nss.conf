# 诊断变体（SBE_VARIANT=diag）的 NSS 档位。
#
# 本文件覆盖 files/etc/nss.conf（render-overlay.sh 先铺 files/ 再叠
# files-diag/）。
#
# v18 起 WiFi 管理面已通（128 MiB/卡 DMA 池，见 patches/0035），管理不再
# 依赖 NSS。v19 把档位从 off 切到 wired（qca-ssdk + qca-nss-dp），用来
# 回答唯一剩下的问题：25.12 的 NSS 有线通路在这个 6.12 内核上装载/转发
# 是否正常 —— 生产镜像 run 41 的「PHY up、零帧、3-4 分钟复位循环」是否
# 由 NSS 装载引起。判据：
#   - nss-load 日志里 sdk/dp 两层 PASS（无 -EINVAL/超时）；
#   - eth0..eth3 出现在 /sys/class/net 且 eth0 挂进 br-lan；
#   - 管理面仍在（WiFi AP 不因 NSS 装载掉线），600 s 兜底前系统不复位。
# 若装载即硬复位：bootcmd 的 diag 标志已自清，自然回到 24.10，无需干预。
#
# fallback=off：本变体不做自动降档实验，档位固定，避免混淆判据。
# 本文件在 RAM 镜像里，改动不落盘，重启即恢复。
tier=wired
fallback=off
budget=3
