# 25.12-6.12 NSS 数据通路启停策略，由 /etc/init.d/nss（S15）在启动时读取。
#
# 与 24.10 不同，25.12 上 QSDK NSS 栈（qca-ssdk / qca-nss-dp / qca-nss-ppe /
# qca-nss-ecm）不再随 kmodloader 自动装载，也不再随 rcS 自动启动；改由
# /usr/sbin/nss-load 按档位分层装载。目的：一是先拿到一个不碰 NSS 的
# 25.12 启动基线，二是逐层装载定位是哪一层把内核带进 oops/复位
# （25.12 的复位机制是 panic_on_oops=1 + panic=1，见 docs/NSS_AUTOLOAD_OFF.md）。
#
# tier 取值：
#   off    什么都不装载。没有以太网口，改回本文件只能用恢复模式/离线挂 overlay。
#   wired  qca-ssdk + qca-nss-dp。有线管理与网络恢复的最小集合，也是 fallback 值。
#   full   有线 + qca-nss-ppe 全家 + qca-nss-ecm。生产默认（2026-11-22 起，
#          复验 PASS 见 docs/NEXT_NSS_FULL.md §3.4）。
# 其它值（sdk / dp / ppe / ecm / sfe）仅供 nss-load 手工分层使用，启动时也接受。
#
# fallback / budget：每启动一次计数器 +1；系统在 300 秒内没有崩溃时
# nss-load commit 把计数器清零。连续 budget 次启动都没等到 commit，启动改用
# fallback 档，避免一次改档把设备锁死在复位循环里。改档后请保留 fallback。
tier=full
fallback=wired
budget=3
