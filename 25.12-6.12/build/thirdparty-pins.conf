# 25.12-6.12 第三方插件清单（18 个插件，19 个仓库）
#
# 语法（制表符分列，# 开头为注释）：
#
#   repo <key> <url> <branch> <pinned-commit> <subdir>[,<subdir>...] [notes]
#
#   key       本文件内唯一的短名，也是 subdir 为 "." 时的包目录名
#   branch    仅供人看；构建按汇总提交解析（默认分支由远端 HEAD 判断）
#   pinned    40 位 commit。它只是**离线/复现基线**：正常构建（默认
#             SBE_PLUGIN_MODE=latest）会去远端解析最新版本 tag（没有版本
#             tag 的仓库取默认分支头），只有新提交是 pin 的后代时才采用。
#             分叉/回退保持 pin 并告警，远端不可达则按 SOURCE_UNAVAILABLE
#             回退到 pin（构建继续，产物标注 STALE）。
#   subdir    "." 表示仓库根就是包目录；多个用逗号分隔，包目录名取
#             basename（"." 取 key）。脚本逐个 rm -rf 后整目录安装到
#             <装配树>/package/<name>。
#
# 实际使用的提交写入 <装配树>/.sbe-plugins.tsv，并进入 release notes。
# 复现旧镜像：SBE_PLUGIN_MODE=pinned（全部按本文件的 pinned-commit）。
# 本文件**不会**被构建过程改写。
#
# 布局与依赖依据（2026-11-13 核实于各自 pinned 提交）：
#   - 12 个自维护包（Arthur97172）：仓库根即包目录，po/zh_Hans 均有；
#   - passwall：仓库根下只有 luci-app-passwall/；po/zh_Hans 是指向 zh-cn
#     的软链，luci.mk 的 LUCI_LC_ALIAS 会把它生成为 luci-i18n-passwall-zh-cn；
#   - passwall-packages：无版本 tag（只有 api-cache），只取 24.10 用过的
#     6 个包，不整仓安装（geoview/hysteria/naiveproxy 等需要更新的 Go 或
#     额外审计）。microsocks、xray-core、sing-box 在 25.12 官方 packages
#     feed 里已有，必须用官方版，不能写成这里（同名包会被扫描出两份）；
#   - nikki：nikki / luci-app-nikki / mihomo-meta 三个包目录；mihomo-meta
#     从源码用树内 golang 编译（25.12 为 Go 1.26/1.27），不需要预编译下载；
#   - OpenClash：只有 luci-app-openclash；中文 .lmo 由包自己装进主题 i18n
#     目录，**没有**独立的 luci-i18n-openclash-zh-cn 包；
#   - bandix：前端仓库根下 luci-app-bandix-plus/；后端仓库根下
#     openwrt-bandix-plus/（目录名与包名 bandix-plus 不同，无需重排）；
#   - argon：仓库根即主题包。v3 起设置页并入主题包，仓库里还留着一个
#     compat/luci-app-argon-config/ 迁移包（空的同名包，与主题包文件冲突）。
#     安装脚本会删掉该 compat/ 目录，本清单**不得**加入 luci-app-argon-config。
#
# 授权：第三方插件统一 LICENSE_REVIEW_REQUIRED（见 docs/PLUGINS.md）；
# 12 个自维护包按各自仓库 LICENSE 记录（GPL-3.0 / GPL-3.0-only 等）。

