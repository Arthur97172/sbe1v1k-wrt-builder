# 本文件由 24.10-6.6/files/etc/modules.conf 覆盖 ubox 默认示例内容。
#
# 关闭 ath12k 向 qca_nss_wifi_plugins 注册 FSE/PPE 回调（ath12k_fse_init
# 早退）。不关时，Wi-Fi 侧编程 PPE 流表会导致有线 WAN 口（SSDK port5，
# 2.5G QCA8081）TX 取包通路楔死，只能重启或端口复位恢复——2026-11-26
# 真机判别实验（ARM B/C/D/F）定案，见 docs/WAN-TX-WEDGE-2026-11-25.md
# §11。有线 ECM/PPE 加速不受影响；Wi-Fi 客户端流量改为普通转发路径。
#
# examples:
# options mod1 option=val
# blacklist mod2

options ath12k fse=0
