# 24.10-6.6 第三方应用开关清单（文件 B）
#
# 用法：
#   - 行首不加 #  = 启用该行列出的包（会写进 .config 并参与编译）
#   - 行首加 #    = 关闭该行列出的包（会写成 "# CONFIG_PACKAGE_x is not set"）
#   - 没有被本文件提到的包，行为不变（由 config-seed 与源码包内 .config 决定）
#
# 规则：
#   1. 文件里的 CUSTOM_PACKAGES="..." 语法只是给人和编辑器看的载体，
#      实际由 scripts/custom-packages.sh 逐词解析，按空白切分。
#   2. 这里只放**应用层**开关。依赖库（coreutils、ruby、libtirpc、xray-core、
#      sing-box、mihomo-meta 等）留在 config-seed，由 defconfig 自行解析；
#      因此关闭某个应用**不会**自动移除它的依赖库。
#   3. passwall 的 INCLUDE_* 子选项无法用这套语法表达，仍留在 config-seed。
#   4. 启用一个源码包中不存在的包名时，构建会在 "Apply custom packages" 步骤直接
#      失败并指名，不会静默出一个少包的镜像。
#   5. 新增第三方应用 = 先在文件 A（build/thirdparty-feeds.conf）登记源并补
#      sources/PROVENANCE.md 与许可证审查，再在这里打开。
#
# 本文件当前内容与 2026-11-07 的插件清单一致（文件 B 启用的应用）。

# ---------------------------------------------------------------------------
# 已启用：当前固件包含的应用与系统组件
# ---------------------------------------------------------------------------
CUSTOM_PACKAGES=""

# PassWall 代理面板
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-passwall"

# Nikki 代理面板（mihomo-meta 内核由 config-seed 提供）
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-nikki"

# OpenClash 代理面板（不捆绑内核，运行时由 Web 界面下载）
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-openclash"

# 关机 / 重启按钮（自维护仓库 Arthur97172/luci-app-poweroff，见文件 A）
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-poweroff luci-i18n-poweroff-zh-cn"

# Bandix-plus 流量监控（后端 bandix-plus 由 config-seed 提供）
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-bandix-plus"

# 动态 DNS（随上游 luci 提供，非第三方源）
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-ddns luci-i18n-ddns-zh-cn"

# 在线升级
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-online-upgrade luci-i18n-online-upgrade-zh-cn"

# 定时任务（自维护仓库 Arthur97172/luci-app-tasks，见 upstream-pins.conf）
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-tasks luci-i18n-tasks-zh-cn"

# 网络设置向导（自维护仓库 Arthur97172/luci-app-smartnetpilot）
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-smartnetpilot luci-i18n-smartnetpilot-zh-cn"

# 核心状态（自维护仓库 Arthur97172/luci-app-corestatus；2026-11-08 起取代
# luci-app-xpu-status）
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-corestatus luci-i18n-corestatus-zh-cn"

# OxiDNS 前端（自维护仓库 Arthur97172/luci-app-oxidns）
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-oxidns luci-i18n-oxidns-zh-cn"

# 组网助手（自维护仓库 Arthur97172/luci-app-meshassistant；依赖 routing feed 的
# batctl/kmod-batman-adv、packages feed 的 dawn/socat 与基座的 flock）
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-meshassistant luci-i18n-meshassistant-zh-cn"

# 加速助手（自维护仓库 Arthur97172/luci-app-turboacc；2026-11-13 加入。
# 只做配置面：flow offload / Shortcut-FE / NSS ECM / full-cone NAT / 拥塞控制，
# 依赖 firewall4、ucode 与 luci-base，均为镜像既有组件）
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-turboacc luci-i18n-turboacc-zh-cn"

# ---------------------------------------------------------------------------
# 已启用：官方 LuCI 页面、系统工具与内核模块（2026-11-07 用户清单）
# ---------------------------------------------------------------------------
# uhttpd 的 LuCI 管理页（uhttpd 本体已由 config-seed 选中）
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-uhttpd luci-i18n-uhttpd-zh-cn"

# WireGuard：内核模块 + 用户态工具 + LuCI 配置页。
# 这个 luci feed 里的 luci-proto-wireguard 没有 po/ 目录，因此源码树里不存在
# luci-i18n-wireguard-zh-cn；它的界面文案走 luci-base 的中文翻译。
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-proto-wireguard wireguard-tools kmod-wireguard"

# 常用工具与内核模块。curl/tmux/kmod-nft-socket/kmod-nft-tproxy/ca-bundle 此前
# 已由 seed 选中，这里显式列出，让 verify-image.sh 也逐条断言它们真的在镜像里。
# wget-ssl 是该源码树里唯一带 TLS 的 wget 变体（另一个变体是 wget-nossl）；
# 它通过 alternatives 提供 /usr/bin/wget，与 busybox 小程序并存。
CUSTOM_PACKAGES="$CUSTOM_PACKAGES openssh-client-utils tmux curl tar wget-ssl ca-bundle ca-certificates kmod-br-netfilter kmod-nft-socket kmod-nft-tproxy"

# Wi-Fi AP：沿用 config-seed 的 wpad-mesh-openssl-noextns=y——QSDK 树只导入了
# noextns 变体（qcn-app-extns 不在导入里，见 config-seed 的 G3.4 说明与
# docs/STAGE3_INTEGRATION_PLAN.md §3.4）；802.11s mesh 与 SAE 都在，只少了
# QCA 私有扩展。此项不在本文件 B 的开关范围内，由 seed 决定。

# Argon 主题（第三方，文件 A 的 argon 仓库）。v3 起设置页并入主题包本身，
# 中文包名沿用 argon-config 消息域，故是 luci-i18n-argon-config-zh-cn；
# 不要再加 luci-app-argon-config（上游发行里的同名包只是空迁移包，会冲突）。
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-theme-argon luci-i18n-argon-config-zh-cn"

# ---------------------------------------------------------------------------
# 未启用：按需取消注释即可。启用前请先确认文件 A 已登记对应源，
# 并补 sources/PROVENANCE.md 与许可证记录（LICENSE_REVIEW_REQUIRED）。
#
# 注意：本区列出的包当前都没有进入固件；一旦取消注释就会**启用**它。
# 反过来，把启用区的某行注释掉 = 关闭该包。文件 B 是应用层开关的唯一依据。
# ---------------------------------------------------------------------------

