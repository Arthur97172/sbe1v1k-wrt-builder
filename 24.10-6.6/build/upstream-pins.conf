# 24.10-6.6 源码装配的上游钉定表。
#
# 语法：<dest><TAB><url><TAB><commit><TAB><mode><TAB><notes>
#   dest   相对 sources/ 根的目标路径；mode=base 时是 "buildroot"
#   url    匿名可访问的 https 仓库；不允许分支名、latest、镜像回退
#   commit 40 位 commit SHA（不接受 tag/分支/短 SHA）
#   重定向/浅克隆一律按 commit 取，取不到即 SOURCE_UNAVAILABLE，不降级
#
# mode 语义：
#   base     整棵基座树（qsdk 14.0 镜像）。先铺这一层，后面的 replace 覆盖它。
#   replace  rsync -a --delete 把仓库根替换到 dest（.git 不落地）。
#   overlay  同上，但之后还要叠加 files-6.6 / 仓库 overlay（仅 kernel 行使用）。
#
# 表里没有的 QSDK 组件（qca/src/nss/*、qca/feeds/* 等）**不替换**：
# 已逐字节核实审计树与 qsdk 基座一致（见 docs/SOURCE_ASSEMBLY.md §4）。
# 它们由 base 层提供，指纹会验证装配结果没有偏离。
#
# ------------------------------------------------------------------ 基座
buildroot	https://github.com/everything411/qsdk	21a8d13393aa8c7d2abf806e62a8dac2ba7af52f	base	14.0.1595.1670 单提交镜像，**不可信基线**；只复现已审计字节，PROVENANCE 如实标注
