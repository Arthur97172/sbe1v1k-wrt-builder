# 装配时从基座树里整体删除的路径。
#
# 语法：<路径><TAB><理由>，路径相对 sources/buildroot/，必须以 / 结尾表示整棵子树。
#
# 每一条都要能在装配后断言“它确实不存在”，并且要在 build/known-delta.conf 里
# 有对应的记录——否则指纹比对会把删除当成漂移。
#
# **允许为空**（只有注释）。目前没有任何路径需要剪裁。
#
# 2026-10-25 撤回 qca/src/u-boot-2025 的剪裁。当时理由是“target.mk 去掉了 16 个
# uboot-* 默认包、.config 里没有 uboot-2025”，但那只说明 **uboot-2025 这个包**不选，
# 不等于这棵源码树没人用：platform_utils/sysupgrade-helper 的 PKG_NAME 就是
# u-boot-2025，它经 include/local-development.mk 把这棵本地树当源码
# （PKG_UNPACK=mkdir -p $(PKG_BUILD_DIR); $(CP) $(LOCAL_SRC)/*），编译出镜像里的
# /usr/bin/{mkimage,dumpimage}。树被删后 local-development.mk 的 ifeq 不成立，
# PKG_UNPACK 静默退回 PKG_SOURCE_PROTO:=git + 空 PKG_SOURCE_URL，构建目录从未被
# 填充，包在 0.4 秒内以 "No rule to make target 'tools-only'" 失败
# （CI run 40176273728 就是这么死的）。同一目录当时还被
# fingerprint-exclude.conf 排除，指纹因此也看不见它消失——两处一起改。
#
# 结论：剪裁任何 qca/src 子树之前，先确认没有**选中的包**依赖它。装配脚本第 14 步
# 的“源码依赖断言”会逐个核对（MISSING_IMPLICIT / MISSING_EXPLICIT），不要再靠
# “.config 里没有同名包”这种推理。

