# 装配时从基座树里整体删除的路径。
#
# 语法：<路径><TAB><理由>，路径相对 sources/buildroot/，必须以 / 结尾表示整棵子树。
#
# 每一条都要能在装配后断言“它确实不存在”，并且要在 build/known-delta.conf 里
# 有对应的记录——否则指纹比对会把删除当成漂移。
#
# 为什么可以删 u-boot-2025：target.mk 已经去掉 16 个 uboot-* 默认包（见
# build/target-feed-fixes/0002），冻结 .config 里没有任何 uboot-2025 选中项，
# 它只是基座镜像里带着的一棵没用的源码树。删掉它省 1.1 GB，且不会影响镜像内容。

qca/src/u-boot-2025/	未参与编译的 U-Boot 2025 源码树（16 个 uboot-* 包已从 target.mk 移除）
