# sources/passwall-selected 的派生清单。
#
# 语法：<包名><TAB><说明>
# 装配方式：从第三方源 openwrt-passwall-packages（由 build/thirdparty-feeds.conf
# 的 repo passwall-packages 钉定到提交 049aaf47…）里整目录复制 <包名>，
# 不带 .git，不做任何修改——它是纯拷贝，审计树已验证 7 个目录逐字节一致。
#
# 为什么单独成树：feeds.conf 里 passwall_selected 是独立 src-link
# （sources/passwall-selected），只放这 7 个包，避免整棵 passwall-packages
# 参与 feed 扫描（那会带上几十个不用的包）。
#
# 改这里等于改镜像里可选的包集合：同步更新 build/feeds.conf.in（如新增 feed
# 名）与指纹基线，并按 P3 的流程发布新的 sources-vN。

chinadns-ng	DNS 转发/分流
dns2socks	socks5 → DNS
ipt2socks	socks5 → iptables（透明代理）
microsocks	轻量 socks5 服务端
shadowsocksr-libev	SSR 客户端库
simple-obfs	流量混淆
tcping	TCP 连通性探测
