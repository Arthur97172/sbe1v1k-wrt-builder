# ===========================================================================
# 2026-11-07：用户要求移除 cpu-status / wifihistory，新增五个自维护插件
# （tasks、smartnetpilot、corestatus（原 xpu-status）、oxidns、meshassistant），并把“插件跟最新
# 版本”做成「pin 刷新 + 自动开 PR」（scripts/ci/refresh-pins.sh）。
#
# 这里有一处刻意的放宽：第三方/自维护**插件树**不再逐文件对齐审计基线，改用
# any 方向白名单。理由：
#   1) 这些树属于应用层，不参与 QSDK 内核、Wi-Fi 脚本、基座与 LuCI 主树的安全
#      审计（那部分门禁一条没放宽）；
#   2) 完整性由 upstream-pins.conf / thirdparty-feeds.conf 里的 40 位 commit
#      SHA 保证——refresh-pins.sh 只改 SHA，改动仍以 PR 形式评审；
#   3) 若继续要求逐字节等于基线，每次插件升版都得先重建十万条基线，门禁会反向
#      逼人“先改基线再升版”，失去意义。
# 补偿控制（都在装配脚本里，不是口头约定）：custom-packages.sh 逐包反查文件 B
# 的每个包是否真的进了 .config；feeds-links.conf 条数断言 177；feeds.conf.in
# 条数断言 11；verify-image.sh 在镜像里逐个复查清单里的包。
apps/*	any	自维护单包插件仓库（11 个 luci-app-*）：内容随 upstream-pins.conf 的 commit 变化，完整性由 40 位 SHA + PR 评审保证，不参与安全审计
thirdparty/*	any	第三方多包仓库（passwall/passwall-packages/nikki/openclash/poweroff/argon/mosdns）：随 thirdparty-feeds.conf 的 commit 变化；cpu-status 与 wifihistory 目录已整体移除，2026-11-07 第二批加入 argon 主题树；2026-11-15 移除 luci-app-bandix-plus 仓库、加入 sbwml/luci-app-mosdns（只用其 luci-app-mosdns/ 与 geo2txt/，mosdns/ 的 Go 源码因工具链版本不构建），同日又整体移除 bandix 后端仓库 openwrt-bandix-plus
thirdparty-feed/*	any	thirdparty-feed 的相对软链集合由文件 A 的 link/local 行生成；本次删掉 cpu-status/wifihistory 两条，第二批加入 luci-theme-argon 一条；2026-11-15 删掉 luci-app-bandix-plus，加入 luci-app-mosdns/geo2txt/mosdns 三条，随后删掉 bandix-plus 一条（local 行），共 11 条（装配 12c 断言 mosdns 三条存在、sha256 与仓库一致、bandix 前后端软链均缺席）
passwall-selected/*	any	7 个包从新的 passwall-packages pin 重新派生，内容必然与基线不同；包集合仍由 build/passwall-selected.conf 固定为 7 个（装配断言）
buildroot/package/feeds/sbe1v1k_apps/*	any	apps/ 的 package/feeds 软链；条数由 feeds-links.conf 决定（装配断言 177，2026-11-15 先是 175→178，同日移除 bandix-plus 后改为 177）
buildroot/package/feeds/thirdparty/*	any	同上；本次删掉 cpu-status/wifihistory 两条软链，第二批加入 luci-theme-argon 一条；2026-11-15 删掉 luci-app-bandix-plus 一条、加入 luci-app-mosdns/geo2txt/mosdns 三条，随后又删掉 bandix-plus 一条（目标存在且含 Makefile 由装配第 13 步断言）
local-relayout/mosdns*	fresh-only	2026-11-15：mosdns 后端的预编译二进制包装包（Makefile 包装 v5.3.4-r15 的 Release 资产、LICENSE 为 GPL-3.0 原文）。源码构建受工具链限制（go.mod 要求 1.26.0，树内 golang/host 1.23.12），取舍理由写在该 Makefile 头与 PROVENANCE §2.9；门禁：装配 12c 断言 Makefile 存在且 PKG_HASH 与仓库一致

