# 门禁：assemble-sources.sh 应用后断言该分支存在且包在 CONFIG_IEEE80211BE 的
# #ifdef 内。verify-image.sh 按既有契约不执行目标二进制，镜像级证据是本轮
# 本地用 qemu-aarch64 跑重编后的 wpad：11ac/11ax/11be/sae 探针全部 exit 0
# （补丁前 11be 为 exit 1）；真机上的 LuCI 表现记为 NOT TESTED。
buildroot/qca/src/network/services/hostapd/src/utils/build_features.h	changed	0021：has_feature() 新增 11be 分支（仅在 CONFIG_IEEE80211BE 下生效），供 LuCI 的 hostapd -v 探针识别
