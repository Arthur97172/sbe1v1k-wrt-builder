# ===========================================================================
# 2026-11-07：用户要求移除 cpu-status / wifihistory，新增五个自维护插件
# （tasks、smartnetpilot、corestatus（原 xpu-status）、oxidns、meshassistant），并把“插件跟最新
# 版本”做成「pin 刷新 + 自动开 PR」（scripts/ci/refresh-pins.sh）。
#
# 这里有一处刻意的放宽：第三方/自维护**插件树**不再逐文件对齐审计基线，改用
# any 方向白名单。理由：
#   1) 这些树属于应用层，不参与 QSDK 内核、Wi-Fi 脚本、基座与 LuCI 主树的安全
#      审计（那部分门禁一条没放宽）；
#   2) 完整性由 upstream-pins.conf / thirdparty-feeds.conf 里的 40 位 commit
#      SHA 保证——refresh-pins.sh 只改 SHA，改动仍以 PR 形式评审；
#   3) 若继续要求逐字节等于基线，每次插件升版都得先重建十万条基线，门禁会反向
#      逼人“先改基线再升版”，失去意义。
# 补偿控制（都在装配脚本里，不是口头约定）：custom-packages.sh 逐包反查文件 B
# 的每个包是否真的进了 .config；feeds-links.conf 条数断言 174；feeds.conf.in
# 条数断言 11；verify-image.sh 在镜像里逐个复查清单里的包。
apps/*	any	自维护单包插件仓库（10 个 luci-app-*）：内容随 upstream-pins.conf 的 commit 变化，完整性由 40 位 SHA + PR 评审保证，不参与安全审计
thirdparty/*	any	第三方多包仓库（passwall/passwall-packages/nikki/openclash/poweroff/bandix/argon）：随 thirdparty-feeds.conf 的 commit 变化；cpu-status 与 wifihistory 目录已整体移除，2026-11-07 第二批加入 argon 主题树
thirdparty-feed/*	any	thirdparty-feed 的相对软链集合由文件 A 的 link/local 行生成；本次删掉 cpu-status/wifihistory 两条，第二批加入 luci-theme-argon 一条
passwall-selected/*	any	7 个包从新的 passwall-packages pin 重新派生，内容必然与基线不同；包集合仍由 build/passwall-selected.conf 固定为 7 个（装配断言）
buildroot/package/feeds/sbe1v1k_apps/*	any	apps/ 的 package/feeds 软链；条数由 feeds-links.conf 决定（装配断言 174）
buildroot/package/feeds/thirdparty/*	any	同上；本次删掉 cpu-status/wifihistory 两条软链，第二批加入 luci-theme-argon 一条
buildroot/package/feeds/routing	fresh-only	新增 routing feed 的目录本身（下面两条软链的父目录）
buildroot/package/feeds/routing/*	fresh-only	新增 routing feed 的两条软链（batctl、batman-adv），供 luci-app-meshassistant 的 +batctl-default +kmod-batman-adv 依赖
buildroot/package/feeds/packages/dawn	fresh-only	meshassistant 的 +dawn 依赖；包一直在基座树里，本次才接线
buildroot/package/feeds/packages/libgcrypt	fresh-only	dawn 的 +libgcrypt 硬依赖；第三批未接线，defconfig 因此丢弃该依赖（warning: dawn/Makefile has a dependency on 'libgcrypt', which does not exist），dawn 在 cmake 阶段找不到库直接失败；本次补链
buildroot/package/feeds/packages/libgpg-error	fresh-only	libgcrypt 的 +libgpg-error 依赖；与上一条同时补链
buildroot/package/feeds/packages/socat	fresh-only	meshassistant 的 +socat 依赖；同上
buildroot/package/feeds/luci/luci-proto-batman-adv	fresh-only	meshassistant 的 +luci-proto-batman-adv 依赖；包一直在 luci 树里
buildroot/package/feeds/luci/luci-lib-uqr	fresh-only	luci-proto-wireguard 的 +luci-lib-uqr 硬依赖；未接线时 defconfig 丢弃该依赖，opkg install 报 cannot find dependency luci-lib-uqr（run 42401311130）；本次补链
buildroot/package/feeds/packages/xz	fresh-only	tar 的 EXTRA_DEPENDS=xz（CONFIG_PACKAGE_TAR_XZ=y 时生效，kconfig 不解析 EXTRA_DEPENDS，因此不会自动选中）；未接线时 opkg install 报 cannot find dependency xz for tar（run 42401311130）；本次补链，xz 又带出 xz-utils/liblzma
buildroot/package/feeds/luci/luci-app-uhttpd	fresh-only	第二批：uhttpd 的 LuCI 管理页软链；源码一直在 luci/applications/ 里，本次接线
buildroot/package/feeds/luci/luci-proto-wireguard	fresh-only	第二批：WireGuard 协议页软链；源码一直在 luci/protocols/ 里，本次接线
buildroot/package/feeds/packages/tar	fresh-only	第二批：用户清单要求系统 tar；包在 qca/feeds/packages/utils/tar，本次接线
buildroot/package/feeds/packages/wget	fresh-only	第二批：wget-ssl 的来源包（qca/feeds/packages/net/wget），本次接线
buildroot/package/feeds/packages/openssh	fresh-only	第二批：openssh-client-utils 的来源包（qca/feeds/packages/net/openssh），本次接线
buildroot/feeds/routing	fresh-only	feeds.conf.in 新增第 7 条 src-link（qca/feeds/routing）；装配断言 src-link=11
buildroot/feeds.conf	changed	同上：多出 src-link routing 一行；装配时由 feeds.conf.in 安装并断言不含宿主绝对路径
buildroot/.config	changed	按新包集合重新冻结（config-seed + 文件 B → defconfig）：去掉 cpu-status/wifihistory，加入 5 个应用与 batctl-default/kmod-batman-adv/dawn/socat/flock/luci-proto-batman-adv；第二批再加入 luci-app-uhttpd、luci-proto-wireguard/wireguard-tools/kmod-wireguard、kmod-br-netfilter、tar、wget-ssl、ca-certificates、openssh-client-utils 与 luci-theme-argon；第三批补齐 dawn 的 libgcrypt/libgpg-error 两条依赖（此前未接线被 defconfig 丢弃，构建因此失败），并补 luci-lib-uqr（luci-proto-wireguard 依赖）与 xz（tar 的 EXTRA_DEPENDS 运行时依赖，kconfig 不解析）另一条同类缺口；另清理了 16 条在当前树里已无定义的 `CONFIG_DEFAULT_uboot-*` 残留符号（旧 .config 从厂商种子继承，kconfig 不识别、本无效果；check-config.sh 归一化 diff 为空即证）；2026-11-08 又把 initramfs 压缩从 NONE 改为 XZ（CONFIG_TARGET_INITRAMFS_COMPRESSION_XZ），只影响 Image-initramfs（恢复模式 RAM 镜像），正常内核仍由 Kernel/SetNoInitramfs 剥掉 INITRAMFS 行
buildroot/qca/src/linux-6.6/scripts/Makefile.lib	changed	0019：initramfs 的 cpio.xz 从内核默认的 `--lzma2=dict=1MiB` 改为 `-9e --lzma2=dict=128MiB`。内核解码端接受 dict ≤3 GiB（lib/xz/xz_dec_lzma2.c），251 MB 的 cpio 用 1 MiB 字典只压到 65.0 MB（Image 74.8 MiB，超 RAM 启动上限），64 MiB 字典 54.4 MB（Image 64.7 MiB，仍超），128 MiB 字典 52.1 MB（Image 62.5 MiB，落在已知 PASS 的 64 MiB 以内）。这是内核源码树里唯一的改动，审计哈希失效范围即此一个文件

# 0021 让 wpad 的 has_feature() 报告 "11be"。审计镜像的 hostapd 是 CodeLinaro
