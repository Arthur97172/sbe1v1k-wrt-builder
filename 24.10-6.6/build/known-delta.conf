# 共用、uci 迁移、LuCI 选项与 802.11r），任一缺失即 ASSERTION_FAILED；
# verify-image.sh 另在镜像里复查同一组标记。
buildroot/qca/feeds/wlan-open/mac80211/wifi-scripts/files/lib/netifd/hostapd.sh	changed	0018：新增 psk-sae-compat 的 key_mgmt/RSNE 处理，omit_rsnxe 与主 override 共用
buildroot/qca/feeds/wlan-open/mac80211/wifi-scripts/files/lib/netifd/netifd-wireless.sh	changed	0018：新增 sae-compat → auth_type=psk-sae-compat（必须排在通用 sae* 之前）
buildroot/qca/feeds/wlan-open/mac80211/wifi-scripts/files/lib/wifi/mac80211.uc	changed	0018：/sbin/wifi 的 uci 迁移不再把 sae-compat 改写成 sae
luci/modules/luci-mod-network/htdocs/luci-static/resources/view/network/wireless.js	changed	luci-patches/0001：加密模式下拉增加 Compatibility Mode（AP-only）

