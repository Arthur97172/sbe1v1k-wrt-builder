# 审计树与装配树之间“允许存在”的差异白名单。
#
# 语法：<glob><TAB><direction><TAB><reason>
#   direction: any | audited-only | fresh-only | changed
#   glob      : fnmatch，* 可跨 /，路径相对 sources/
#
# 规则：默认为空。每加一条都必须在 reason 里写清为什么这不是问题，
# 并且要在装配脚本的断言里另行验证（不能只靠白名单把差异盖掉）。
# 装配结果与审计树应当逐条一致；出现差异先当成装配漏项排查，
# 确认是有意的剪裁后再登记。
#
# 除此之外预期为空：u-boot-2025 已不再剪裁也不再排除（见 prune.conf），内核编译
# 产物、feeds 索引都在 fingerprint-exclude.conf 里对称排除，两侧都看不到。

