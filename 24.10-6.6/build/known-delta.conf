# ===========================================================================
# 2026-11-07：用户要求移除 cpu-status / wifihistory，新增五个自维护插件
# （tasks、smartnetpilot、xpu-status、oxidns、meshassistant），并把“插件跟最新
# 版本”做成「pin 刷新 + 自动开 PR」（scripts/ci/refresh-pins.sh）。
#
# 这里有一处刻意的放宽：第三方/自维护**插件树**不再逐文件对齐审计基线，改用
# any 方向白名单。理由：
#   1) 这些树属于应用层，不参与 QSDK 内核、Wi-Fi 脚本、基座与 LuCI 主树的安全
#      审计（那部分门禁一条没放宽）；
#   2) 完整性由 upstream-pins.conf / thirdparty-feeds.conf 里的 40 位 commit
#      SHA 保证——refresh-pins.sh 只改 SHA，改动仍以 PR 形式评审；
#   3) 若继续要求逐字节等于基线，每次插件升版都得先重建十万条基线，门禁会反向
#      逼人“先改基线再升版”，失去意义。
# 补偿控制（都在装配脚本里，不是口头约定）：custom-packages.sh 逐包反查文件 B
# 的每个包是否真的进了 .config；feeds-links.conf 条数断言 164；feeds.conf.in
# 条数断言 11；verify-image.sh 在镜像里逐个复查清单里的包。
apps/*	any	自维护单包插件仓库（10 个 luci-app-*）：内容随 upstream-pins.conf 的 commit 变化，完整性由 40 位 SHA + PR 评审保证，不参与安全审计
thirdparty/*	any	第三方多包仓库（passwall/passwall-packages/nikki/openclash/poweroff/bandix）：随 thirdparty-feeds.conf 的 commit 变化；cpu-status 与 wifihistory 目录已整体移除
thirdparty-feed/*	any	thirdparty-feed 的相对软链集合由文件 A 的 link/local 行生成；本次删掉 cpu-status/wifihistory 两条
passwall-selected/*	any	7 个包从新的 passwall-packages pin 重新派生，内容必然与基线不同；包集合仍由 build/passwall-selected.conf 固定为 7 个（装配断言）
buildroot/package/feeds/sbe1v1k_apps/*	any	apps/ 的 package/feeds 软链；条数由 feeds-links.conf 决定（装配断言 164）
buildroot/package/feeds/thirdparty/*	any	同上；本次删掉 cpu-status/wifihistory 两条软链
buildroot/package/feeds/routing	fresh-only	新增 routing feed 的目录本身（下面两条软链的父目录）
buildroot/package/feeds/routing/*	fresh-only	新增 routing feed 的两条软链（batctl、batman-adv），供 luci-app-meshassistant 的 +batctl-default +kmod-batman-adv 依赖
buildroot/package/feeds/packages/dawn	fresh-only	meshassistant 的 +dawn 依赖；包一直在基座树里，本次才接线
buildroot/package/feeds/packages/socat	fresh-only	meshassistant 的 +socat 依赖；同上
buildroot/package/feeds/luci/luci-proto-batman-adv	fresh-only	meshassistant 的 +luci-proto-batman-adv 依赖；包一直在 luci 树里
buildroot/feeds/routing	fresh-only	feeds.conf.in 新增第 7 条 src-link（qca/feeds/routing）；装配断言 src-link=11
buildroot/feeds.conf	changed	同上：多出 src-link routing 一行；装配时由 feeds.conf.in 安装并断言不含宿主绝对路径
buildroot/.config	changed	按新包集合重新冻结（config-seed + 文件 B → defconfig）：去掉 cpu-status/wifihistory，加入 5 个应用与 batctl-default/kmod-batman-adv/dawn/socat/flock/luci-proto-batman-adv；check-config.sh 归一化 diff 为空即证
