# 0017 把 QSDK openwrt-patches 里 busybox.mk 的 Package/busybox/overrideconfig
# 注释掉。审计树的 .packageinfo/.config-package.in 里都没有这条 config 覆盖
# （tmp/info 下的逐包扫描信息在 overlay 加入之前生成、之后没有失效），所以审计
# 固件用的是 CONFIG_BUSYBOX_CUSTOM=n + OpenWrt 默认 applets；而 CI 现场全量扫描
# 会读到它，把 39 个 CONFIG_BUSYBOX_DEFAULT_* 连同 TIMEOUT/EDITING_MAX_LEN 一起
# 翻成 QSDK 的默认值——那就是另一个 busybox 了。补丁只去掉 config 覆盖，
# install 扩展（inetd/inittab/rcS，审计构建实际生效过）与 patches/ 原样保留。
# 证据：审计树 tmp/.packageinfo 无 openwrt-patches 的 Config.in 行；
# build_dir/…/busybox-1.36.1/.config 为 EDITING_MAX_LEN=512、无 CONFIG_TIMEOUT；
# build_dir/…/ipkg-*/busybox/etc/init.d/inetd 存在（install 扩展生效）。
# 门禁：check-config.sh 归一化 diff 必须为空，就是这条差异的可执行证明。
buildroot/openwrt-patches/package/utils/busybox/busybox.mk	changed	0017 注释掉 config 覆盖：审计时该覆盖从未生效，按审计行为复现

