# 仓库对装配树的贡献表（上游钉定见 upstream-pins.conf，补丁见各 SERIES）。
#
# 语法：<op><TAB><src><TAB><dest><TAB><说明>
#   op     copy-tree  目录内容合并进 dest（rsync -a，不删除 dest 里已有的东西）
#          copy-file  单文件复制，dest 是完整文件路径
#   src    相对**仓库根**（含 24.10-6.6/ 前缀；25.12 的 blob 因此写成 25.12-6.12/...）
#   dest   相对 sources/
#
# 为什么要从 25.12 取 Wi-Fi blob：这 6 个专有文件（16 MB）只提交了一份，在
# 25.12-6.12/build/local-packages/sbe-wifi-firmware/files/ 下；两版内容逐字节
# 相同，仅安装目录不同（QCN9274/hw2.0 vs QCN92XX/hw1.0）。24.10 不重复提交
# 二进制，装配时按下面的映射拷入，并由 files/FILES-SHA256 校验。
# 代价是跨版本耦合：任一版改 blob 都要同步改两边的 FILES-SHA256。
# 许可状态仍是 LICENSE_REVIEW_REQUIRED，不因“来源是本仓库”而改变。

# ---------------------------------------------------------------- 内核 overlay
# files-6.6 是“要盖进内核树的那一层”，由 ipq95xx/Makefile 在解析期整棵 cp
# 进 linux-6.6。所以 RTL8261N 的 Kconfig/Makefile 修改以整文件形式放在这里，
# 而不是对内核打补丁——审计树就是这么装的。
copy-tree	24.10-6.6/build/kernel-overlay/drivers/net/phy/rtl8261n	buildroot/target/linux/feeds/files-6.6/drivers/net/phy/rtl8261n	RTL8261N 驱动 18 个文件
copy-file	24.10-6.6/build/kernel-overlay/drivers/net/phy/Kconfig	buildroot/target/linux/feeds/files-6.6/drivers/net/phy/Kconfig	加 source rtl8261n/Kconfig
copy-file	24.10-6.6/build/kernel-overlay/drivers/net/phy/Makefile	buildroot/target/linux/feeds/files-6.6/drivers/net/phy/Makefile	加 obj-$(CONFIG_RTL8261N_PHY)
copy-file	24.10-6.6/build/p-b/files/arch/arm64/boot/dts/qcom/ipq9574-sbe1v1k.dts	buildroot/target/linux/feeds/files-6.6/arch/arm64/boot/dts/qcom/ipq9574-sbe1v1k.dts	板级设备树（0002 补丁只改 dts Makefile）

# ------------------------------------------------------- openwrt-patches 替换件
# 上游 QSDK 的 0002 是按 14.1 的 procd 写的（rcS 用 const char *），套到本版
# 14.0 的 procd 2024.12.22~42d39376 上会因 hunk 上下文不符而失败。审计树用的
# 是重排上下文后的同一份补丁，所以这里**整文件替换**上游那一份，而不是再放进
# package/system/procd/patches/ 追加一条（追加会与 0002 重复打同一段代码）。
# 交付路径就是 quilt 会扫描的路径：include/quilt.mk 用 FindPackage 在
# openwrt-patches/ 下找到同名目录后应用其 patches/。
copy-file	24.10-6.6/build/openwrt-patches/package/system/procd/patches/0002-procd-Enable-maximum-runqueue.patch	buildroot/openwrt-patches/package/system/procd/patches/0002-procd-Enable-maximum-runqueue.patch	替换上游 0002（rcS 上下文重排，代码不变）

