# package/feeds/<feed>/<name> 软链清单。
#
# 语法：<链接路径><TAB><解析后的目标>，两列都相对 sources/，按链接路径排序。
# 装配脚本按行 `ln -s`（目标写成从链接所在目录出发的相对路径），不跑
# scripts/feeds update/install，因此不生成 *.index/*.targetindex 和 *.tmp/
# （scripts/feeds 的缓存，指纹里已排除）。
#
# 为什么记“解析后的目标”而不是原始 link 文本：审计树里这些链接有两种写法，
# 一部分直接指向 ../../../qca/feeds/...（或 apps/、thirdparty/），另一部分经
# ../../../feeds/<feed>/... 这层软链；两者解析结果相同（指纹也只比较解析结果）。
# 如果照抄文本，装配时就得复刻 feeds/<feed> 这层中间软链的写法差异，毫无意义。
#
# 校验：每条目标必须存在且含 Makefile；条数必须为 164。
