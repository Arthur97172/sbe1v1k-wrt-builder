# 树指纹与源码包的共用排除清单。
#
# 语法：<kind><TAB><pattern>，空行与 # 注释忽略。
#   dir   <前缀>/     路径等于前缀或以它开头（递归整棵子树）
#   path  <路径>      完全相等
#   glob  <通配>      fnmatch，* 可以跨过 /（因此一条规则即覆盖整棵子树）
#
# 路径一律相对 sources/ 根，不带前导 ./ 或 /。
#
# 两条硬规则，改动清单时不能忘：
#   1. 排除的东西必须能由装配过程重建，否则指纹会放过真实差异；
#   2. 每条 glob 都要能被 `tree-fingerprint.sh --check-exclusions` 干净上游
#      验证：命中干净源码即 EXCLUSION_TOO_BROAD。这条闸门就是为 *.pem、
#      *.map、*.scr、lib/test_fortify 这类“看起来像产物、其实是源码”的
#      文件准备的。

# ----------------------------------------------------------------- 编译目录
dir	buildroot/build_dir/
dir	buildroot/staging_dir/
dir	buildroot/tmp/
dir	buildroot/bin/
dir	buildroot/dl/
dir	buildroot/logs/
# files/ 由 scripts/render-overlay.sh 从 24.10-6.6/files 渲染，不含在源码包里
dir	buildroot/files/

# ----------------------------------------------------- feeds 缓存与生成的索引
# scripts/feeds update 生成的 .index/.targetindex/.tmp 内含宿主路径
glob	buildroot/feeds/*.index
glob	buildroot/feeds/*.targetindex
# 整个 <feed>.tmp 目录（含 .packageinfo/.targetinfo）都是 scripts/feeds 的
# 缓存，装配时不生成。glob 的 * 跨 /，一条即覆盖目录本身与其内容。
glob	buildroot/feeds/*.tmp
# feeds/base 是构建期建的软链（-> package/）
path	buildroot/feeds/base

# ------------------------------------------------------- 编译生成的版本与密钥
path	buildroot/version
path	buildroot/version.date
glob	buildroot/key-build*
glob	buildroot/.config.old
glob	buildroot/.config.*.bak
glob	buildroot/.config.*backup

# --------------------------------------------------------------- VCS 元数据
# .git 不参与构建，且装配树里 git checkout 出来的 .git 与审计树的 pack 字节
# 永远不同（时序、GC、packfile 布局）。它不满足“可由装配过程重建”，但也不是
# 构建输入：每棵树的身份由 upstream-pins.conf 的 40 位 commit + 装配时的
# `rev-parse HEAD` 断言 + recipe_sha256 共同钉住，比 .git 的字节更强。
# 只排子仓库根的 .git；build_dir 里那两个（libcork、jitterentropy-rngd）本来
# 就在 dir buildroot/build_dir/ 内。新增子仓库时这里要同步加规则，否则它会被
# 指纹当成 audited-only/fresh-only 的差异报出来——这正是想要的行为。
glob	luci/.git
glob	luci/.git/*
glob	apps/*/.git
glob	apps/*/.git/*
glob	thirdparty/*/.git
glob	thirdparty/*/.git/*

# ------------------------------------------------------------ 已决定剪裁的目录
# qsdk 基座里的 u-boot-2025 不参与编译（target.mk 已去掉 16 个 uboot-* 默认包，
# .config 里也没有任何 uboot-2025 选中项），装配时整体删除。
dir	buildroot/qca/src/u-boot-2025/

# ------------------------------------------- 就地编译的内核（qca/src/linux-6.6）
# 内核在源码树里直接编译，产物与源码混在一起。以下规则都锚定在这棵子树，
# 不得提升到全树：buildroot 的其他位置有大量同名后缀的源码文件。
dir	buildroot/qca/src/linux-6.6/user_headers/
dir	buildroot/qca/src/linux-6.6/include/generated/
dir	buildroot/qca/src/linux-6.6/include/config/
dir	buildroot/qca/src/linux-6.6/arch/arm64/include/generated/
glob	buildroot/qca/src/linux-6.6/arch/*/include/generated/*

# `make headers_install` 把导出头写进 usr/include/。干净内核在这里只有
# .gitignore / Makefile / headers_check.pl 三个源码文件，所以不能用一条
# `dir usr/include/` 覆盖整棵目录——那会把三个源码也排掉（--check-exclusions
# 会判 EXCLUSION_TOO_BROAD）。下面 12 个生成目录逐个点名，它们在上游内核里
# 都不存在。
dir	buildroot/qca/src/linux-6.6/usr/include/asm/
dir	buildroot/qca/src/linux-6.6/usr/include/asm-generic/
dir	buildroot/qca/src/linux-6.6/usr/include/drm/
dir	buildroot/qca/src/linux-6.6/usr/include/fwctl/
dir	buildroot/qca/src/linux-6.6/usr/include/linux/
dir	buildroot/qca/src/linux-6.6/usr/include/misc/
dir	buildroot/qca/src/linux-6.6/usr/include/mtd/
dir	buildroot/qca/src/linux-6.6/usr/include/rdma/
dir	buildroot/qca/src/linux-6.6/usr/include/scsi/
dir	buildroot/qca/src/linux-6.6/usr/include/sound/
dir	buildroot/qca/src/linux-6.6/usr/include/video/
dir	buildroot/qca/src/linux-6.6/usr/include/xen/
# scripts/dtc/include-prefixes 是上游提交的软链农场（9 个指向 arch/*/boot/dts），
# 不是产物，不能排除。

glob	buildroot/qca/src/linux-6.6/*.o
glob	buildroot/qca/src/linux-6.6/*.a
glob	buildroot/qca/src/linux-6.6/*.ko
glob	buildroot/qca/src/linux-6.6/*.cmd
glob	buildroot/qca/src/linux-6.6/*.mod
glob	buildroot/qca/src/linux-6.6/*.mod.c
glob	buildroot/qca/src/linux-6.6/*.order
glob	buildroot/qca/src/linux-6.6/*.symvers
glob	buildroot/qca/src/linux-6.6/*.dtb
glob	buildroot/qca/src/linux-6.6/*.dtbo
glob	buildroot/qca/src/linux-6.6/*.tmp
# .d 不能全树排除：上游有 tools/testing/selftests/{ftrace/test.d,alsa/conf.d}
# 两个真实目录。产物只出现在下面两处。
path	buildroot/qca/src/linux-6.6/usr/.initramfs_data.cpio.d
glob	buildroot/qca/src/linux-6.6/lib/test_fortify/*.log.d
glob	buildroot/qca/src/linux-6.6/*.i
glob	buildroot/qca/src/linux-6.6/*.lex.c
glob	buildroot/qca/src/linux-6.6/*.tab.c
glob	buildroot/qca/src/linux-6.6/*.asn1.c
glob	buildroot/qca/src/linux-6.6/*.asn1.h
glob	buildroot/qca/src/linux-6.6/*.gcno
glob	buildroot/qca/src/linux-6.6/*.gcda
glob	buildroot/qca/src/linux-6.6/*.su
glob	buildroot/qca/src/linux-6.6/*.lst
glob	buildroot/qca/src/linux-6.6/*.elf
glob	buildroot/qca/src/linux-6.6/*.output
# .log 不能全树排除：tools/testing/kunit/test_data/ 里是上游测试夹具。
# 产物只来自 fortify 自测。
path	buildroot/qca/src/linux-6.6/lib/test_fortify.log
glob	buildroot/qca/src/linux-6.6/lib/test_fortify/*.log
glob	buildroot/qca/src/linux-6.6/*.orig
glob	buildroot/qca/src/linux-6.6/*.rej

# 只排内核根目录的 .config*（生成物）；arch/*/configs/*.config 是源码。
glob	buildroot/qca/src/linux-6.6/.config*
glob	buildroot/qca/src/linux-6.6/*.prepared*
glob	buildroot/qca/src/linux-6.6/*.checked-*
glob	buildroot/qca/src/linux-6.6/*.built
glob	buildroot/qca/src/linux-6.6/*.configured
glob	buildroot/qca/src/linux-6.6/*.dep_files
glob	buildroot/qca/src/linux-6.6/*.image
glob	buildroot/qca/src/linux-6.6/*.modules
glob	buildroot/qca/src/linux-6.6/*.scmversion
glob	buildroot/qca/src/linux-6.6/*.vermagic
glob	buildroot/qca/src/linux-6.6/*.tmp_vmlinux*
glob	buildroot/qca/src/linux-6.6/*.vmlinux.export.c

# vmlinux 不能写成 *vmlinux：上游有 scripts/Makefile.vmlinux、extract-vmlinux。
path	buildroot/qca/src/linux-6.6/vmlinux
glob	buildroot/qca/src/linux-6.6/*vmlinux.o
glob	buildroot/qca/src/linux-6.6/*vmlinux.a
glob	buildroot/qca/src/linux-6.6/*vmlinux.symvers
glob	buildroot/qca/src/linux-6.6/*built-in.a
glob	buildroot/qca/src/linux-6.6/*System.map
glob	buildroot/qca/src/linux-6.6/*Module.symvers
glob	buildroot/qca/src/linux-6.6/*modules.builtin*
glob	buildroot/qca/src/linux-6.6/*modules.order
glob	buildroot/qca/src/linux-6.6/*kernel/config_data*

# 明确点名的生成文件（不靠宽通配，避免误伤源码）
path	buildroot/qca/src/linux-6.6/init/utsversion-tmp.h
path	buildroot/qca/src/linux-6.6/lib/crc32table.h
path	buildroot/qca/src/linux-6.6/lib/gen_crc32table
path	buildroot/qca/src/linux-6.6/drivers/scsi/scsi_devinfo_tbl.c
path	buildroot/qca/src/linux-6.6/arch/arm64/boot/Image
path	buildroot/qca/src/linux-6.6/arch/arm64/kernel/vmlinux.lds
path	buildroot/qca/src/linux-6.6/arch/arm64/kernel/vdso/vdso.lds
path	buildroot/qca/src/linux-6.6/arch/arm64/kernel/vdso/vdso.so
path	buildroot/qca/src/linux-6.6/arch/arm64/kernel/vdso/vdso.so.dbg
path	buildroot/qca/src/linux-6.6/scripts/basic/fixdep
path	buildroot/qca/src/linux-6.6/scripts/dtc/dtc
path	buildroot/qca/src/linux-6.6/scripts/dtc/fdtoverlay
path	buildroot/qca/src/linux-6.6/scripts/dtc/dtc-parser.tab.h
