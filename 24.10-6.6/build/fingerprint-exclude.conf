path	buildroot/qca/src/linux-6.6/scripts/kconfig/parser.tab.h
path	buildroot/qca/src/linux-6.6/scripts/mod/modpost
path	buildroot/qca/src/linux-6.6/scripts/mod/mk_elfconfig
path	buildroot/qca/src/linux-6.6/scripts/mod/elfconfig.h
path	buildroot/qca/src/linux-6.6/scripts/mod/devicetable-offsets.h
path	buildroot/qca/src/linux-6.6/scripts/mod/devicetable-offsets.s
path	buildroot/qca/src/linux-6.6/scripts/module.lds
path	buildroot/qca/src/linux-6.6/scripts/sorttable
path	buildroot/qca/src/linux-6.6/scripts/unifdef
# 另一批“源码里没有、编译后才出现”的产物：汇编器展开的 .S 副本、
# 编译期 offsets、以及 usr/ 下 initramfs 的生成物（上游只有 .S/.c 源码）。
path	buildroot/qca/src/linux-6.6/arch/arm64/crypto/sha512-core.S
path	buildroot/qca/src/linux-6.6/arch/arm64/kernel/asm-offsets.s
path	buildroot/qca/src/linux-6.6/kernel/bounds.s
path	buildroot/qca/src/linux-6.6/usr/gen_init_cpio
path	buildroot/qca/src/linux-6.6/usr/initramfs_data.cpio
path	buildroot/qca/src/linux-6.6/usr/initramfs_inc_data

# ------------------------------------------------- 内核之外零星的宿主侧产物
glob	buildroot/scripts/config/*.o
path	buildroot/scripts/config/conf

# ------------------------------- 审计树里残留的编译产物 / 手工备份（装配树没有）
# 审计时在 luci 树内就地编译过：lemon/jsmin/po2lmo 三个宿主二进制、它们的 .o、
# 以及 lemon 由 plural_formula.y 生成的 .c/.h。上游 luci 的固定提交里只有
# .c/.y 源码，这些路径在干净源码上不存在，所以用逐条 path 排除（不用 *.o 通配，
# 免得把某个包真的提交进来的目标文件一起排掉）。
path	luci/modules/luci-base/src/contrib/lemon
path	luci/modules/luci-base/src/jsmin
path	luci/modules/luci-base/src/jsmin.o
path	luci/modules/luci-base/src/po2lmo
path	luci/modules/luci-base/src/po2lmo.o
path	luci/modules/luci-base/src/lib/lmo.o
path	luci/modules/luci-base/src/lib/plural_formula.c
path	luci/modules/luci-base/src/lib/plural_formula.h
path	luci/modules/luci-base/src/lib/plural_formula.o
# sbe1v1k-build.sh 改 .config 之前留的备份，以及手工编辑 qca-nss-ecm/Makefile
# 时 patch 留下的 .orig。
path	buildroot/.config.sbe-bak
path	buildroot/qca/feeds/nss/clients/qca-nss-ecm/Makefile.orig
